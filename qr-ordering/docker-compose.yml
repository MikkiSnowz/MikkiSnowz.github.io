# Local MySQL for development:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qr_ordering
      MYSQL_USER: qr_user
      MYSQL_PASSWORD: qr_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      # 3307 on your computer, so it doesn't clash with a MySQL you already have installed.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
